<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mosaphoto — mur de photos</title>
  <meta name="description" content="Créez une mosaïque de photos (jusqu'à 100) composée automatiquement, en 4K ou 1080p, portrait ou paysage.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="9" height="11" rx="1.5"/><rect x="13" y="3" width="9" height="6" rx="1.5"/><rect x="13" y="11" width="9" height="10" rx="1.5"/><rect x="2" y="16" width="9" height="5" rx="1.5"/></svg>
      <span>Mosaphoto</span>
    </div>
    <div class="status" id="status">Ajoutez des photos pour commencer</div>
  </header>

  <main class="layout">
    <aside class="panel">
      <section class="block">
        <h2>Photos <span class="count" id="count">0 / 100</span></h2>
        <label class="dropzone" id="dropzone">
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          <strong>Glissez vos photos ici</strong>
          <span>ou cliquez pour choisir (100 max)</span>
        </label>
        <div class="thumbs" id="thumbs"></div>
        <button class="link" id="clearBtn" hidden>Tout retirer</button>
      </section>

      <section class="block">
        <h2>Format</h2>
        <div class="seg" role="radiogroup" data-name="orientation">
          <button data-value="landscape" class="on">
            <span class="ico ico-land"></span>Paysage
          </button>
          <button data-value="portrait">
            <span class="ico ico-port"></span>Portrait
          </button>
        </div>
        <div class="seg" role="radiogroup" data-name="resolution">
          <button data-value="4k" class="on">4K<small>3840 × 2160</small></button>
          <button data-value="1080" >1080p<small>1920 × 1080</small></button>
        </div>
      </section>

      <section class="block">
        <h2>Style</h2>
        <label class="row">Espacement <output id="gapOut">8 px</output></label>
        <input type="range" id="gap" min="0" max="40" value="8">
        <label class="row">Coins arrondis <output id="radiusOut">0 px</output></label>
        <input type="range" id="radius" min="0" max="40" value="0">
        <div class="row">
          <label for="bg">Couleur de fond</label>
          <input type="color" id="bg" value="#ffffff">
        </div>
        <label class="check"><input type="checkbox" id="border" checked> Bordure extérieure</label>
        <label class="check"><input type="checkbox" id="keepOrder"> Garder l'ordre d'import</label>
        <button class="btn ghost" id="shuffleBtn" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          Autre composition
        </button>
      </section>

      <section class="block">
        <h2>Export</h2>
        <div class="seg" role="radiogroup" data-name="format">
          <button data-value="image/jpeg" class="on">JPEG</button>
          <button data-value="image/webp" id="webpBtn">WebP<small>plus léger</small></button>
        </div>
        <label class="row">Qualité <output id="qualityOut">85</output></label>
        <input type="range" id="quality" min="50" max="100" value="85">
        <div class="row">
          <label for="maxSize">Poids max</label>
          <select id="maxSize">
            <option value="0">Pas de limite</option>
            <option value="1">1 Mo</option>
            <option value="2">2 Mo</option>
            <option value="5" selected>5 Mo</option>
            <option value="10">10 Mo</option>
          </select>
        </div>
        <button class="btn primary" id="exportBtn" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m0 0-4-4m4 4 4-4M4 20h16"/></svg>
          Télécharger la mosaïque
        </button>
        <p class="result" id="result" hidden></p>
      </section>
    </aside>

    <section class="stage">
      <div class="frame" id="frame">
        <canvas id="preview"></canvas>
        <div class="empty" id="empty">
          <p>Votre mur de photos apparaîtra ici.</p>
          <p class="muted">La composition s'adapte automatiquement aux photos en portrait et en paysage.</p>
        </div>
        <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyText">Composition…</span></div>
      </div>
      <div class="meta" id="meta"></div>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
